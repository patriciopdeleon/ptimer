<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pTimer</title><meta name="description" content="One to five timers. One tap. A simple timer for the things you do again and again.">
  <meta name="theme-color" content="#d9dbdd">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="pTimer">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=6">
  <link rel="icon" type="image/png" href="icons/icon-192.png?v=6">
  <link rel="stylesheet" href="style.css?v=38"><script src="app.js?v=38" defer></script>
</head>
<body>
  <div class="global-controls">
    <div class="pane-picker">
      <div id="pane-menu" class="pane-menu" role="group" aria-label="Number of timer panes" hidden>
        <button class="pane-option" type="button" data-count="1" aria-label="Show 1 timer pane">1</button>
        <button class="pane-option" type="button" data-count="2" aria-label="Show 2 timer panes">2</button>
        <button class="pane-option" type="button" data-count="3" aria-label="Show 3 timer panes">3</button>
        <button class="pane-option" type="button" data-count="4" aria-label="Show 4 timer panes">4</button>
        <button class="pane-option" type="button" data-count="5" aria-label="Show 5 timer panes">5</button>
      </div>
      <button id="pane-count-toggle" class="pane-count-toggle" type="button" aria-label="Choose number of timer panes" aria-expanded="false" aria-controls="pane-menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <path d="M5 6h14M5 12h14M5 18h14" />
        </svg>
      </button>
    </div>
    <button id="sound" class="sound" aria-pressed="true" aria-label="Sound on"></button>
  </div>
  <main id="timers" aria-label="Repeat timers"></main>
  <div id="announcements" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
